<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>CO₂eq Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Montserrat", system-ui, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .big {
      font-size: 140px;
      font-weight: 500;
      line-height: 1;
      text-align: center;
    }

    .unit {
      font-size: 48px;
      font-weight: 500;
      margin-left: 16px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="big">
    <span id="kg">0.00</span>
    <span class="unit">kg CO₂eq</span>
  </div>

  <script>
    const el = document.getElementById("kg");
    const es = new EventSource("/events");
    es.onmessage = e => {
      const data = JSON.parse(e.data);
      el.textContent = Number(data.totalKg).toFixed(2);
    };
  </script>
</body>
</html>
